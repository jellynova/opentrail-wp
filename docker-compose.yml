
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentrail}
      POSTGRES_USER: ${POSTGRES_USER:-opentrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opentrail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-opentrail}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opentrail}
      SECRET_KEY: ${SECRET_KEY}
      FERNET_KEY: ${FERNET_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      DOCUMENTS_PATH: /app/documents
      # Point this at a bind-mounted network drive / SharePoint sync folder to make
      # OpenTrail store new documents there instead of its own volume (see
      # backend/app/core/config.py and services/document_manager.py). Leave blank to
      # keep the original managed-storage behaviour.
      SHARED_DRIVE_PATH: ${SHARED_DRIVE_PATH:-}
      SHARED_DRIVE_LABEL: ${SHARED_DRIVE_LABEL:-Shared Drive}
    volumes:
      - documents_data:/app/documents
      # Example: mount a host path (itself a mapped network drive / SMB mount / OneDrive
      # or SharePoint sync folder) read-write into the container, then set
      # SHARED_DRIVE_PATH=/app/shared-drive above to point OpenTrail at it.
      - ${SHARED_DRIVE_HOST_PATH:-./.shared-drive-disabled}:/app/shared-drive
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  documents_data:
